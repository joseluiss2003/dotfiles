# SwayP spotify-player defaults.
# Theme colors are generated from the active SwayP theme by swayp-theme-set.

theme = "swayp"

# Keep playback compact but expressive: track first, artist/album second,
# controls and device metadata last.
playback_format = "{status} {track} {liked}\n{artists} • {album}\n{metadata}"
playback_metadata_fields = ["repeat", "shuffle", "volume", "device"]

border_type = "Plain"
progress_bar_type = "Rectangle"
progress_bar_position = "Bottom"

play_icon = "▶"
pause_icon = "▌▌"
liked_icon = "♥"
explicit_icon = "(E)"

enable_media_control = true
enable_notify = true
enable_cover_image_cache = true
enable_mouse_scroll_volume = true
enable_audio_visualization = true
enable_relative_line_number = true

# Give the cover and visualizer enough room to breathe in the playback pane.
cover_img_length = 10
cover_img_width = 7
page_size_in_rows = 20
seek_duration_secs = 5
volume_scroll_step = 5

[layout]
# SwayP library: playlists are the primary surface. Album/artist panes are
# reduced to the minimum valid remaining width.
library = { album_percent = 0, playlist_percent = 99 }
playback_window_position = "Top"
playback_window_height = 8

[device]
name = "spotify-player"
device_type = "speaker"
bitrate = 320
audio_cache = true
normalization = true
autoplay = false
