"$schema" = 'https://starship.rs/config-schema.json'

palette = "matugen"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$character
"""

[palettes.matugen]
foreground = "{{ colors.on_surface.default.hex }}"
primary = "{{ colors.primary.default.hex }}"
secondary = "{{ colors.secondary.default.hex }}"
tertiary = "{{ colors.tertiary.default.hex }}"
error = "{{ colors.error.default.hex }}"
muted = "{{ colors.on_surface_variant.default.hex }}"

[username]
show_always = true
style_user = "bold fg:foreground"
format = "[$user](fg:foreground)"

[hostname]
ssh_only = false
style = "bold fg:primary"
format = "[@$hostname](fg:primary) "

[directory]
style = "bold fg:secondary"
truncation_length = 3
truncate_to_repo = false
format = "[$path](fg:secondary) "

[git_branch]
symbol = "󰘬 "
style = "bold fg:tertiary"
format = "[$symbol$branch](fg:tertiary) "

[git_status]
style = "fg:primary"
format = "[$all_status$ahead_behind](fg:primary) "

[character]
success_symbol = "[❯](bold fg:primary)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❮](bold fg:primary)"

[cmd_duration]
min_time = 2000
format = " took [$duration](fg:muted)"
